[project]
name = "pr-review-agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "agno>=1.0",
    "litellm>=1.0",
    "langfuse>=2.0",
    "pydantic>=2.0",
    "fastmcp>=0.4",
    "PyGithub>=2.0",
    "python-dotenv>=1.0",
    "deepeval>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
